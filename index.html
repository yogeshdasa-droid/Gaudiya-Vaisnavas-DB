<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vaiṣṇava-kośa</title>
    <!-- Splash: plain HTML/CSS so it paints before the app bundle loads. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f4f1ec;
        color: #1f1b16;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      html.dark #splash {
        background: #0e0e12;
        color: #ece8e1;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: splash-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #splash .logo {
        width: 76px;
        height: 76px;
        border-radius: 17px;
        box-shadow: 0 14px 40px rgba(122, 36, 49, 0.35);
      }
      #splash .name {
        font-size: 19px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #splash .bar {
        position: relative;
        width: 140px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(128, 128, 128, 0.2);
      }
      #splash .bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #f59e4b, #e0701f);
        animation: splash-slide 1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
    <script>
      // Apply the saved theme before the first paint, then reveal the
      // (initially hidden) window once the splash is on screen.
      (function () {
        var theme = "system";
        try {
          theme = JSON.parse(localStorage.getItem("bio.theme") || '"system"');
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        if (theme !== "system") document.documentElement.setAttribute("data-theme", theme);
        var skin = "vscode";
        try {
          skin = JSON.parse(localStorage.getItem("bio.skin") || "\"vscode\"");
        } catch (e) {}
        document.documentElement.setAttribute("data-skin", skin);
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var t = window.__TAURI_INTERNALS__;
            if (t) t.invoke("plugin:window|show", { label: "main" }).catch(function () {});
          });
        });
      })();
    </script>
  </head>
  <body>
    <div id="splash">
      <div class="box">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="22" fill="#7a2431" />
          <path d="M16 36 Q33 28 49 36 V80 Q33 72 16 80Z" fill="#fff8ec" />
          <path d="M84 36 Q67 28 51 36 V80 Q67 72 84 80Z" fill="#fff8ec" />
          <path d="M44 12 V24 Q44 31 50 32 Q56 31 56 24 V12" fill="none" stroke="#c9962b" stroke-width="4" stroke-linecap="round" />
          <path d="M50 33 Q47 36 50 40 Q53 36 50 33Z" fill="#9fd08f" />
        </svg>
        <div class="name">Vaiṣṇava-kośa</div>
        <div class="bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
